services:
  postgres:
    image: postgres:17
    container_name: daynix-postgres
    environment:
      POSTGRES_DB: daynix
      POSTGRES_USER: daynix
      POSTGRES_PASSWORD: daynix
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daynix -d daynix"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: daynix-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/daynix
      SPRING_DATASOURCE_USERNAME: daynix
      SPRING_DATASOURCE_PASSWORD: daynix
      SPRING_PROFILES_ACTIVE: docker
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: daynix-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
