spring:
  application:
    name: daynix-app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/daynix}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:Apple@1559#}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${APP_JWT_SECRET:VGhpcy1pcy1hLWRheW5peC1kZXZlbG9wbWVudC1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcyE=}
    access-token-minutes: ${APP_JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${APP_JWT_REFRESH_TOKEN_DAYS:14}
  password-reset:
    token-minutes: ${APP_PASSWORD_RESET_TOKEN_MINUTES:30}
